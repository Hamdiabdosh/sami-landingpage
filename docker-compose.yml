# Production stack for Coolify — deploy as "Docker Compose" (not Dockerfile-only)
# Domain: https://sami.raafat.site → assign to the `app` service, port 3000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sami_showcase}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sami_showcase}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify proxies to this port — do NOT bind host ports (avoids 3000 conflicts)
    expose:
      - "3000"
    labels:
      # ponytail: explicit port — fixes Coolify/Traefik 404 when proxy can't auto-detect port
      - traefik.http.services.app.loadbalancer.server.port=3000
      - caddy_0.handle_path.0_reverse_proxy={{upstreams 3000}}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sami_showcase}
      # DATABASE_URL built at startup from POSTGRES_* (see scripts/docker-entrypoint.sh)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://sami.raafat.site}
      SITE_URL: ${SITE_URL:-${BETTER_AUTH_URL:-https://sami.raafat.site}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-https://sami.raafat.site,http://sami.raafat.site}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sami.et}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-sami2026}
      RUN_SEED: ${RUN_SEED:-true}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
